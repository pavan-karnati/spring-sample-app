pipeline:
  name: spring-sample-app-pr-build
  identifier: springsampleappprbuild
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: pavankarnatigh
        build: <+input>
  stages:
    - stage:
        name: Build
        identifier: Build
        description: ""
        type: CI
        spec:
          caching:
            enabled: true
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Set Image Tag
                  identifier: set_image_tag
                  spec:
                    shell: Sh
                    image: alpine:3.19
                    command: |
                      BRANCH="<+codebase.sourceBranch>"
                      # Sanitize: lowercase, replace non-alphanumeric (except hyphen/dot) with hyphen,
                      # strip leading/trailing hyphens — safe Docker tag
                      IMAGE_TAG=$(echo "$BRANCH" \
                        | tr '[:upper:]' '[:lower:]' \
                        | sed 's|/|-|g' \
                        | sed 's|[^a-z0-9.-]|-|g' \
                        | sed 's|^-*||;s|-*$||')
                      echo "Branch '$BRANCH' -> tag '$IMAGE_TAG'"
                    outputVariables:
                      - name: IMAGE_TAG
              - step:
                  type: Test
                  name: RunTestsWithIntelligence
                  identifier: RunTestsWithIntelligence
                  spec:
                    command: mvn test
                    shell: Sh
                    image: maven:3.9-eclipse-temurin-17
                    intelligenceMode: true
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - target/surefire-reports/*.xml
              - step:
                  type: Run
                  name: Maven Package
                  identifier: maven_package
                  spec:
                    command: mvn package -DskipTests
                    shell: Sh
                    image: maven:3.9-eclipse-temurin-17
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Image
                  identifier: build_push_image
                  spec:
                    connectorRef: dockerhub
                    repo: kpkr7/springsampleapp
                    tags:
                      - <+steps.set_image_tag.output.outputVariables.IMAGE_TAG>
                    caching: true
    - stage:
        name: deploy-minikube
        identifier: deployminikube
        description: ""
        type: Deployment
        spec:
          deploymentType: NativeHelm
          service:
            serviceRef: springsampledev
            serviceInputs:
              serviceDefinition:
                type: NativeHelm
                spec:
                  manifests:
                    - manifest:
                        identifier: dev
                        type: HelmChart
                        spec:
                          store:
                            type: Github
                            spec:
                              branch: <+codebase.sourceBranch>
          environment:
            environmentRef: devminikube
            deployToAll: false
            infrastructureDefinitions:
              - identifier: minikube
          execution:
            steps:
              - step:
                  name: Helm Deployment
                  identifier: helmDeployment
                  type: HelmDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    ignoreReleaseHistFailStatus: false
                    useUpgradeInstall: true
                    commandFlags:
                      - commandType: Upgrade
                        flag: "--set image.tag=<+pipeline.stages.Build.spec.execution.steps.set_image_tag.output.outputVariables.IMAGE_TAG>"
            rollbackSteps:
              - step:
                  name: Helm Rollback
                  identifier: helmRollback
                  type: HelmRollback
                  timeout: 10m
                  spec: {}
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
