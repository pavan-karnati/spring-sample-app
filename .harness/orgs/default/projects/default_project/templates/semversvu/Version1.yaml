template:
  name: semver-svu
  type: Pipeline
  projectIdentifier: default_project
  orgIdentifier: default
  spec:
    properties:
      ci:
        codebase:
          connectorRef: pavankarnatigh
          build:
            type: branch
            spec:
              branch: main
    stages:
      - stage:
          name: Semver and Release
          identifier: semver_release
          description: Computes next semver via svu, tags the repo, builds and pushes the release image
          type: CI
          spec:
            caching:
              enabled: true
            cloneCodebase: true
            platform:
              os: Linux
              arch: Amd64
            runtime:
              type: Cloud
              spec: {}
            execution:
              steps:
                - step:
                    type: Run
                    name: Compute Next Version
                    identifier: compute_next_version
                    spec:
                      shell: Sh
                      image: alpine/git:2.43.0
                      command: |
                        apk add --no-cache curl tar

                        # Install svu — single binary, no config needed
                        SVU_VERSION="3.4.1"
                        curl -fsSL "https://github.com/caarlos0/svu/releases/download/v${SVU_VERSION}/svu_${SVU_VERSION}_linux_amd64.tar.gz" \
                          | tar -xz -C /usr/local/bin svu

                        # Configure git credentials using Harness-injected netrc vars
                        git config --global credential.helper store
                        echo "https://${DRONE_NETRC_USERNAME}:${DRONE_NETRC_PASSWORD}@github.com" > ~/.git-credentials

                        git fetch --tags

                        # svu next returns the next version based on conventional commits.
                        # If no bumping commits exist it returns the current version unchanged.
                        CURRENT=$(svu current 2>/dev/null || echo "v0.0.0")
                        NEXT=$(svu next 2>/dev/null || echo "$CURRENT")

                        if [ "$NEXT" = "$CURRENT" ]; then
                          echo "No version-bumping commits (feat:/fix: etc) since $CURRENT. Skipping release."
                          NEXT_VERSION="SKIP"
                        else
                          NEXT_VERSION="${NEXT#v}"  # strip leading 'v'
                          echo "Bumping $CURRENT -> v$NEXT_VERSION"
                        fi
                      outputVariables:
                        - name: NEXT_VERSION
                - step:
                    type: Run
                    name: Tag and Push
                    identifier: create_git_tag
                    spec:
                      shell: Sh
                      image: alpine/git:2.43.0
                      command: |
                        VERSION="<+steps.compute_next_version.output.outputVariables.NEXT_VERSION>"
                        if [ "$VERSION" = "SKIP" ]; then
                          echo "Skipping — no version bump needed."
                          exit 0
                        fi

                        git config --global credential.helper store
                        echo "https://${DRONE_NETRC_USERNAME}:${DRONE_NETRC_PASSWORD}@github.com" > ~/.git-credentials
                        git config user.email "ci@harness.io"
                        git config user.name "Harness CI"
                        git fetch --tags

                        if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
                          echo "Tag v${VERSION} already exists, skipping"
                        else
                          git tag -a "v${VERSION}" -m "Release v${VERSION}"
                          git push origin "v${VERSION}"
                          echo "Tagged and pushed v${VERSION}"
                        fi
                - step:
                    type: Run
                    name: Maven Package
                    identifier: maven_package
                    spec:
                      shell: Sh
                      image: maven:3.9-eclipse-temurin-17
                      command: |
                        VERSION="<+steps.compute_next_version.output.outputVariables.NEXT_VERSION>"
                        if [ "$VERSION" = "SKIP" ]; then
                          echo "Skipping build — no version bump."
                          exit 0
                        fi
                        mvn package -DskipTests
                - step:
                    type: BuildAndPushDockerRegistry
                    name: Build and Push Release Image
                    identifier: build_push_release_image
                    spec:
                      connectorRef: dockerhub
                      repo: kpkr7/springsampleapp
                      tags:
                        - <+steps.compute_next_version.output.outputVariables.NEXT_VERSION>
                        - latest
                      caching: true
  identifier: semversvu
  versionLabel: Version1
