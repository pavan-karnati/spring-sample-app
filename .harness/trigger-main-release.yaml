trigger:
  name: Main Merge Release Trigger
  identifier: MainMergeReleaseTrigger
  enabled: true
  orgIdentifier: default
  projectIdentifier: default_project
  pipelineIdentifier: release
  source:
    type: Webhook
    spec:
      type: Github
      spec:
        type: Push
        spec:
          connectorRef: pavankarnatigh
          autoAbortPreviousExecutions: false
          branchName: main
  inputYaml: |
    pipeline:
      identifier: release
      properties:
        ci:
          codebase:
            build:
              type: branch
              spec:
                branch: main
