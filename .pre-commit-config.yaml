repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        exclude: ^charts/
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  # Conventional Commits — enforces commit message format for git-sv semver bumping
  # Format: <type>[optional scope]: <description>
  # Types that trigger version bumps: feat (minor), fix (patch), feat!/BREAKING CHANGE (major)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Java: format check (Google Java Style via Spotless)
  - repo: local
    hooks:
      - id: spotless-check
        name: Spotless (Java format check)
        language: system
        entry: ./mvnw spotless:check -q
        pass_filenames: false
        files: \.java$

      - id: checkstyle
        name: Checkstyle
        language: system
        entry: ./mvnw checkstyle:check -q
        pass_filenames: false
        files: \.java$

      - id: compile
        name: Compile
        language: system
        entry: ./mvnw compile -q
        pass_filenames: false
        files: \.java$

      - id: tests
        name: Unit Tests
        language: system
        entry: ./mvnw test -q
        pass_filenames: false
        stages: [pre-push]

      - id: helm-lint
        name: Helm Lint
        language: system
        entry: helm lint charts/spring-sample-app
        pass_filenames: false
        files: ^charts/
